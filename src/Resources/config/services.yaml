services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Every class under src/ that is a service. Value objects, enums, exceptions and the
    # plugin class itself are excluded: those are constructed by hand, not by the container.
    #
    # What a service needs is on its constructor, and the container reads the types. The
    # few things a type cannot say are attributes next to the code they concern:
    #   #[Autowire(service: 'fastmon_collector.http_client')]         the plugin's own HTTP client
    #   #[Autowire(service: 'lock.factory')]                          serialises the token refresh
    #   #[AutowireIterator('fastmon_collector.layer_metrics_provider')] the measurement sources
    #   #[AutoconfigureTag(...)] on LayerMetricsProviderInterface       what makes a class a source
    #   #[AsAlias(LayerMetricsProviderInterface::class)]                which source callers get
    #   #[WithMonologChannel('fastmon_collector')]                      the log channel
    # Subscribers, the Twig extension, the resettable RequestInsights and the controller
    # are tagged by autoconfigure from the interfaces they implement.
    Fastmon\Collector\:
        resource: '../../*'
        exclude:
            - '../../FastmonCollector.php'
            - '../../FastmonCollectorException.php'
            - '../../Resources/'
            - '../../Dto/'
            - '../../Api/{OAuthMetadata,OAuthTokens,Pkce,ReadsJsonResponses}.php'
            - '../../Api/*Exception.php'
            - '../../Collection/{CollectionMode,CollectionNotReadyException,DomainCheckResult}.php'
            - '../../Connection/{Connection,Credentials}.php'

    # Built from the factory rather than injected as `http_client`, so the plugin does
    # not depend on the framework's HTTP client being configured in the shop.
    # symfony/http-client is a hard requirement of shopware/core, so the class is
    # always there. Consumers name this service with #[Autowire(service: ...)]: by type
    # alone, autowiring would hand them the framework's client instead.
    fastmon_collector.http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']

    # Public so the router can fetch the controller by its class name.
    Fastmon\Collector\Controller\AdminApiController:
        public: true

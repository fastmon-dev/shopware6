name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Packagist takes the version from the tag, Shopware's plugin lifecycle takes it from
  # composer.json, so one number has two sources and they can drift. What makes the drift
  # expensive is that Composer's VCS driver skips a tag disagreeing with the manifest
  # without saying so: the release is tagged, the workflow is green, and the version
  # simply never appears on Packagist. The tag is therefore refused, not reconciled - a
  # tag that has been published cannot be moved afterwards, because Packagist and the
  # Composer caches keep the tree they saw first.
  #
  # Everything that publishes (zip, GitHub Release, Packagist) follows in #12 and hangs
  # off this job, so a mismatch leaves nothing behind to clean up.
  check-version:
    name: Tag matches composer.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare tag and manifest
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease], for example v0.2.0 or v0.2.0-rc.1. Delete it and tag again."
            exit 1
          fi

          declared="$(jq -r '.version // ""' composer.json)"

          if [ -z "$declared" ]; then
            echo "::error::composer.json has no version field. Shopware reads the plugin version from there, and without it Composer guesses one from the checkout."
            exit 1
          fi

          if [ "${GITHUB_REF_NAME#v}" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match composer.json version $declared. Delete the tag (git push origin :refs/tags/$GITHUB_REF_NAME), set the version on main, tag again."
            exit 1
          fi

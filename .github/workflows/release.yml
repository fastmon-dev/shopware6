name: Release

# Started by hand, not by a tag push, because the tag is the last thing this workflow
# makes rather than the first thing it is given. Composer installs the tagged tree, and
# the administration bundle is built, not committed: a tag on the merge commit would hand
# every `composer require` a plugin with no panel. So the bundle is built here, committed
# on top of the merge commit, and that commit is what gets tagged. main never carries a
# build artefact, and the Composer package carries the same bundle as the store zip.
on:
  workflow_dispatch:

permissions:
  contents: read

# Two runs for one version would race for the same tag. The group is not the one ci.yml
# uses for itself (workflow name and ref), which a called workflow shares with its caller.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Packagist takes the version from the tag, Shopware's plugin lifecycle takes it from
  # composer.json. The tag is now derived from composer.json, so the two cannot disagree;
  # what is left to guard is where the run starts and whether the version is new. A tag
  # that has been published is never moved or reused, because Packagist and the Composer
  # caches keep the tree they saw first.
  #
  # Everything that publishes (tag, GitHub Release, Packagist) hangs off this job, so a
  # refusal leaves nothing behind to clean up.
  check-version:
    name: Version from composer.json
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read and check the version
        id: version
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::A release starts from main, this run started from $GITHUB_REF. Start it again with main selected."
            exit 1
          fi

          version="$(jq -r '.version // ""' composer.json)"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::composer.json version '$version' is not MAJOR.MINOR.PATCH[-prerelease], for example 0.2.0 or 0.2.0-rc.1. Set it in a release PR, then start the release again."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "::error::v${version} is already released. Bump composer.json in a release PR, then start the release again."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

  # The gates a pull request passes, against the commit being released, by calling ci.yml
  # rather than repeating its steps - a release must not be held to a weaker standard than
  # a PR, and a copy drifts.
  ci:
    name: Quality gates
    needs: check-version
    uses: ./.github/workflows/ci.yml

  zip:
    name: Zip, tag and GitHub Release
    needs: [check-version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, create the Release and attach the zip
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      TAG: ${{ needs.check-version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the bundle commit is pushed as a tag on top of this history
          fetch-tags: true
      - uses: shopware/shopware-cli-action@b67b48ccb52beb8533ea276152e1f89f29bbd080 # v3.0.0

      # What .shopware-extension.yml describes: no composer step, assets built, toolchain
      # files left out. The built src/Resources/public/ therefore travels in the zip
      # although main never sees it.
      - name: Build the zip
        run: |
          shopware-cli extension zip . --release \
            --git-commit "$GITHUB_SHA" \
            --filename "FastmonCollector-${VERSION}.zip" \
            --output-directory dist

      # The artefact is checked, not the working tree: the zip is assembled from a clean
      # copy and differs from the tree by design.
      #
      # Without phpstan, and that is not a convenience. The zip leaves out tests/ and
      # phpstan.neon.dist on purpose, so shopware-cli falls back to its own configuration
      # and reports against a tree that is missing half of what the project's own run
      # analyses. PHP static analysis is a source check, at level max, and it has already
      # run on this commit in the ci job above. What stays here is everything that is
      # about the packaged files themselves: store compliance, twig, eslint, stylelint.
      #
      # The no-JS pixel's empty alt is reported as a warning, because the ignore rule for
      # it lives in .shopware-extension.yml, which the zip does not carry. Warnings do not
      # fail the step; an error does.
      - name: Validate the artefact
        run: |
          shopware-cli extension validate --full --check-against highest --exclude phpstan \
            "dist/FastmonCollector-${VERSION}.zip"

      # check-version read the version from the tree. This reads it from the zip that
      # merchants actually install, and confirms the administration bundle is in there: it
      # is gitignored, built during packing, and a plugin that ships without it installs
      # cleanly and then has no module.
      - name: The zip says what composer.json says
        run: |
          archive="dist/FastmonCollector-${VERSION}.zip"

          packed="$(unzip -p "$archive" 'FastmonCollector/composer.json' | jq -r '.version // ""')"

          if [ "$packed" != "$VERSION" ]; then
            echo "::error::The zip reports version $packed, composer.json says $VERSION."
            exit 1
          fi

          if ! unzip -l "$archive" | grep -q 'FastmonCollector/src/Resources/public/administration/'; then
            echo "::error::The zip carries no built administration bundle. Check the asset build in the packing step."
            exit 1
          fi

      # The bundle is taken out of the zip rather than built a second time: webpack's
      # module ids depend on the build directory, so two builds of the same source are not
      # the same bytes, and Composer is meant to get exactly what the store gets. Forced
      # past .gitignore, which keeps it off main and has no say over this one commit.
      - name: Commit the bundle and tag it
        run: |
          unzip -q "dist/FastmonCollector-${VERSION}.zip" 'FastmonCollector/src/Resources/public/*' -d "$RUNNER_TEMP/zip"
          rm -rf src/Resources/public
          cp -R "$RUNNER_TEMP/zip/FastmonCollector/src/Resources/public" src/Resources/public

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --force src/Resources/public
          git commit --quiet \
            -m "build: administration bundle for ${TAG}" \
            -m "Built from ${GITHUB_SHA} on main by the release workflow, so that Composer installs the same administration the store zip carries. This commit exists only under the tag."
          git tag --annotate "$TAG" --message "$TAG"

      # Composer does not get the zip. Packagist hands out GitHub's zipball of the tag,
      # which is `git archive`, and what it leaves out is decided by export-ignore in
      # .gitattributes, a second list next to the excludes in .shopware-extension.yml. Two
      # lists drift, so the two packages are compared file by file, bundle included. Only
      # checksum.json is the zip's own: the store reads it, Composer has no use for it.
      - name: Composer gets what the store gets
        run: |
          unzip -Z1 "dist/FastmonCollector-${VERSION}.zip" \
            | grep -v '/$' \
            | sed 's|^FastmonCollector/||' \
            | grep -v '^checksum\.json$' \
            | sort > "$RUNNER_TEMP/store.txt"
          git archive "$TAG" | tar -t | grep -v '/$' | sort > "$RUNNER_TEMP/composer.txt"

          if ! diff "$RUNNER_TEMP/store.txt" "$RUNNER_TEMP/composer.txt"; then
            echo "::error::The Composer package and the store zip differ (< store only, > Composer only). Bring export-ignore in .gitattributes and build.zip.pack.excludes in .shopware-extension.yml back in line."
            exit 1
          fi

      # The first step that cannot be taken back, so it comes after every check. Only the
      # tag is pushed: the commit under it is reachable from the tag alone.
      - name: Push the tag
        run: git push origin "refs/tags/${TAG}"

      # gh is on the runner, so this needs no third-party action to keep pinned. A version
      # with a suffix (v0.2.0-rc.1) becomes a pre-release: GitHub marks it, and Composer
      # resolves it only for someone who asked for it by constraint.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$VERSION" in
            *-*) prerelease=(--prerelease) ;;
          esac

          gh release create "$TAG" \
            "dist/FastmonCollector-${VERSION}.zip" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "${prerelease[@]}"

  # Packagist serves the git tags of this repository, so a release is not published here
  # so much as announced. The call is explicit rather than left to Packagist's GitHub
  # App: the App reacts to every push, including branches, while this runs only after the
  # guard, the gates and the Release have all succeeded, and its result is visible in the
  # run rather than in a webhook log nobody opens.
  packagist:
    name: Packagist
    needs: [check-version, zip]
    env:
      TAG: ${{ needs.check-version.outputs.tag }}
      VERSION: ${{ needs.check-version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The token travels in the Authorization header, not in the query string the older
      # examples use: a URL ends up in error output, proxy logs and shell history, and a
      # masked secret is only masked where GitHub does the printing. The safe token is
      # enough, because update-package is one of the endpoints Packagist marks SAFE.
      - name: Ask Packagist to re-crawl the package
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          curl --silent --show-error --fail-with-body -X POST \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_API_TOKEN}" \
            -d "{\"repository\":\"https://github.com/${GITHUB_REPOSITORY}\"}" \
            https://packagist.org/api/update-package

      # The crawl is asynchronous and it is where a release goes missing quietly: Composer's
      # VCS driver skips a tag whose name disagrees with composer.json without a word, and a
      # package that was never submitted answers this call and then lists nothing. Either way
      # the Release page looks finished while `composer require` cannot see the version, so
      # the job waits for the listing instead of trusting the POST.
      #
      # Which version string to expect is not obvious. Packagist keeps the tag as the
      # version for a package that declares none, which is what most packages do - but
      # this one declares `version` in composer.json, because Shopware's plugin
      # lifecycle reads it from there, and Composer's VCS driver then reports that value
      # instead. So the tag v0.1.0 is listed as 0.1.0. Both are accepted: the tag is made
      # from that very field, so whichever Packagist reports is the right one, and the
      # package stops being able to lie about it the day the version field can go.
      - name: Wait until Packagist lists the release
        run: |
          package="$(jq -r .name composer.json)"

          # Not a pipeline: the default shell for a step is `bash -e` without `pipefail`,
          # and `jq --exit-status` answers 0 for the empty input a 404 pipes into it. A
          # package that was never submitted would report itself as published.
          for _ in $(seq 1 20); do
            if curl --silent --fail --output metadata.json "https://repo.packagist.org/p2/${package}.json" \
              && jq --exit-status --arg package "$package" --arg tag "$TAG" --arg version "$VERSION" \
                '.packages[$package][] | select(.version == $tag or .version == $version)' metadata.json >/dev/null; then
              echo "Packagist lists $TAG."
              exit 0
            fi

            sleep 15
          done

          echo "::error::Packagist does not list $TAG five minutes after the release. Check that $package is submitted at packagist.org and that the crawl did not skip the tag."
          exit 1

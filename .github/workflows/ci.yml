name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['*']
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that runs without a shop, against every PHP and Shopware branch the
  # plugin supports. No lockfile is committed: the plugin resolves against whichever
  # Shopware the matrix names, and --with pins the branch without editing composer.json.
  quality:
    name: composer ci (PHP ${{ matrix.php }}, Shopware ${{ matrix.shopware }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        shopware: ['~6.6.0', '~6.7.0']
        include:
          # 6.6 stops at PHP 8.4; 6.7 is the branch that runs on 8.5.
          - php: '8.5'
            shopware: '~6.7.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, gd, zip, sodium, pdo_mysql, dom, xml, curl, fileinfo
          coverage: none
      - name: Resolve dependencies against Shopware ${{ matrix.shopware }}
        run: >
          composer update --no-interaction --prefer-dist --no-progress
          --with "shopware/core:${{ matrix.shopware }}"
          --with "shopware/storefront:${{ matrix.shopware }}"
      - run: composer ci

  # The integration suite needs a real shop. Shopware's reusable workflow installs one,
  # requires the plugin into it and runs the plugin's phpunit.xml.dist with the suite
  # named in filterName - see tests/TestBootstrap.php for what happens then.
  integration:
    name: integration (Shopware ${{ matrix.shopware }}, PHP ${{ matrix.php }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shopware: 'v6.6.10.23', php: '8.2' }
          - { shopware: 'v6.6.10.23', php: '8.4' }
          - { shopware: 'v6.7.13.1', php: '8.2' }
          - { shopware: 'v6.7.13.1', php: '8.5' }
    uses: shopware/github-actions/.github/workflows/phpunit.yml@dad4f02d83cd8d75f48272ab6eae22b480858efc
    with:
      extensionName: FastmonCollector
      shopwareVersion: ${{ matrix.shopware }}
      phpVersion: ${{ matrix.php }}
      filterName: integration

  # The store validator. Expected to be silent: the one finding it has, the no-JS pixel's
  # empty alt, is ignored by name and path in .shopware-extension.yml, so anything this
  # step prints is news.
  validate:
    name: shopware-cli extension validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shopware/shopware-cli-action@b67b48ccb52beb8533ea276152e1f89f29bbd080 # v3.0.0
      - run: shopware-cli extension validate --full --check-against highest .

  # The release guard, one step earlier. release.yml refuses a tag that disagrees with
  # composer.json, but by then the tag exists and has to be deleted; on the release PR
  # the same mistake is a red check. Only the version bump itself is inspected: a PR that
  # leaves the field alone passes without a word.
  version:
    name: composer.json version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: New and higher than the base branch
        run: |
          git fetch --depth=1 origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"

          base="$(git show "origin/${GITHUB_BASE_REF}:composer.json" | jq -r '.version // ""')"
          head="$(jq -r '.version // ""' composer.json)"

          if [ -z "$head" ]; then
            echo "::error::composer.json has no version field. Shopware reads the plugin version from there, and without it Composer guesses one from the checkout."
            exit 1
          fi

          if [ "$base" = "$head" ]; then
            echo "Version unchanged at $head."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${head}" >/dev/null 2>&1; then
            echo "::error::v${head} is already tagged. A published version is never re-released - bump to one that has not been."
            exit 1
          fi

          # sort -V reads ~ the way Debian does, and that is the one place where it agrees
          # with semver on prereleases: 0.2.0~rc.1 comes before 0.2.0, 0.2.0-rc.1 would not.
          highest="$(printf '%s\n%s\n' "$(printf '%s' "$base" | sed 's/-/~/')" "$(printf '%s' "$head" | sed 's/-/~/')" | sort -V | tail -n1)"

          if [ "$highest" != "$(printf '%s' "$head" | sed 's/-/~/')" ]; then
            echo "::error::Version goes backwards: $base -> $head. Raise it instead."
            exit 1
          fi

          echo "Version $base -> $head."
